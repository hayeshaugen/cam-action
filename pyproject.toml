[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-action"
version = "0.1.0"
description = "Open adapters for proprietary imaging devices and standard video outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
license = { file = "LICENSE" }
authors = [{ name = "Hayes Haugen" }]
keywords = ["thermal-camera", "camera", "rtsp", "libusb", "obs", "frigate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
cam-action = "cam_action.__main__:main"

[tool.setuptools.packages.find]
include = ["cam_action*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
