[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-bridge"
version = "0.1.0"
description = "An experimental bridge from proprietary USB thermal cameras to RTSP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
keywords = ["thermal-camera", "rtsp", "libusb", "obs", "frigate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Capture",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
thermal-bridge = "thermal_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["thermal_bridge*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
